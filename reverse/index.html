<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#171411" />
    <meta
      name="description"
      content="上传一张照片，让遗憾少一点。自然修复，左右对比，轻松保存。"
    />
    <title>废片拯救器</title>
    <link
      rel="icon"
      type="image/png"
      sizes="64x64"
      href="/logo-renewal.svg"
    />
    <link rel="apple-touch-icon" href="/apple-touch-intaglio.png?v=engraving" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/motion.css" />
    <script src="/ui-motion.js" defer></script>
    <script src="/account.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="gallery-art" aria-hidden="true">
      <picture
        ><source
          media="(max-width: 600px)"
          srcset="/art/renaissance-mobile.webp" />
        <img
          src="/art/renaissance-desktop.webp"
          alt=""
          fetchpriority="high"
          width="1536"
          height="1024"
      /></picture>
    </div>
    <div class="drop-veil" aria-hidden="true">
      <span>放下照片，让这一刻重获新生。</span>
    </div>
    <header class="site-header">
      <a class="brand" href="/" aria-label="废片拯救器首页">
        <span class="brand-emblem" aria-hidden="true"></span
        ><span class="brand-wordmark">废片拯救器</span>
      </a>
      <button id="return-home" class="text-button return-home" type="button" hidden>← 返回首页</button>
      <button
        id="account-toggle"
        class="account-toggle"
        type="button"
        aria-haspopup="dialog"
      >
        登录
      </button>
    </header>

    <main id="main" data-state="empty">
      <section class="intro" aria-labelledby="title">
        <p class="eyebrow">旧日瞬间 · 再度新生</p>
        <h1 id="title">让这一刻，<br class="mobile-break" />重获新生。</h1>
        <p class="intro-copy">修复光影，留住真实。</p>
      </section>

      <section class="workspace" aria-label="照片修复">
        <input
          id="file-input"
          type="file"
          accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp,.dng,.cr2,.cr3,.crw,.nef,.nrw,.arw,.srf,.sr2,.raf,.orf,.ori,.rw2,.rwl,.pef,.ptx,.srw,.3fr,.fff,.iiq,.kdc,.dcr,.mos,.mrw,.raw,.x3f,.erf,.mef"
          hidden
        />
        <div class="upload-entry">
          <button
            id="upload-area"
            class="button primary upload-area"
            type="button"
            aria-label="上传照片"
          >
            <span class="upload-title">选择照片</span
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 12h15m-6-6 6 6-6 6" />
            </svg>
          </button>
          <p class="upload-description">或将照片拖入此处 · 支持粘贴</p>
          <p class="file-note">
            JPG / PNG / WebP · 25 MB <span>相机 RAW · 100 MB</span>
          </p>
        </div>

        <div id="photo-panel" class="photo-panel" hidden>
          <div id="photo-stage" class="photo-stage">
            <img id="original" class="photo" alt="原始照片" draggable="false" />
            <div id="result-layer" class="result-layer" hidden>
              <img
                id="result"
                class="photo"
                alt="修复后的照片"
                draggable="false"
              />
            </div>
            <div
              id="photo-labels"
              class="photo-labels"
              hidden
              aria-hidden="true"
            >
              <span>原图</span><span>已拯救</span>
            </div>
            <div
              id="comparison"
              class="comparison"
              role="slider"
              tabindex="0"
              aria-label="原图与修复后对比"
              aria-orientation="horizontal"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="50"
              aria-valuetext="原图 50%，修复后 50%"
              hidden
            >
              <span class="comparison-line"></span
              ><span class="comparison-handle" aria-hidden="true"
                ><svg viewBox="0 0 28 20">
                  <path d="m10 5-5 5 5 5M18 5l5 5-5 5" /></svg
              ></span>
            </div>
            <div id="processing" class="processing" hidden>
              <div class="processing-status" role="status" aria-live="polite" aria-atomic="true">
                <span class="breathing-dot" aria-hidden="true"></span
                ><span>正在拯救这张照片</span>
              </div>
            </div>
          </div>
        </div>

        <div class="below-photo">
          <div
            id="message"
            class="message"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          ></div>
          <div
            id="quality-picker"
            class="quality-picker"
            role="group"
            aria-label="修复质量"
            hidden
          >
            <button
              type="button"
              data-quality="light"
              aria-pressed="false"
              title="约 1.5K，更快更省"
            >
              轻量
            </button>
            <button
              type="button"
              data-quality="fine"
              aria-pressed="true"
              title="约 2K，优先保留细节"
            >
              精细
            </button>
          </div>
          <div id="actions" class="actions" hidden>
            <button id="rescue" class="button primary" type="button">
              <span id="rescue-text">拯救这张照片</span>
            </button>
            <a id="save" class="button primary" hidden
              ><svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4" /></svg
              >保存照片</a
            >
            <button id="change" class="button secondary" type="button">
              换一张
            </button>
          </div>
          <p id="footnote" class="footnote">
            点击拯救后，照片才会发送至 AI 修复服务。
          </p>
        </div>
      </section>
    </main>

    <footer>
      <span>每一张照片，都有值得留下的理由。</span
      ><span class="footer-signature" aria-hidden="true"
        >光影 · 记忆 · 新生</span
      >
    </footer>
  </body>
</html>
